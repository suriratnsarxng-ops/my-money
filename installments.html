<!doctype html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Money - รายการผ่อน</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#ef6f8b"></head><body><header class="topbar"><div><h1>My Money</h1><p>ระบบบันทึกรายการผ่อน</p></div><nav><a href="index.html">🏠 หน้าหลัก</a><a href="due.html">📅 รายการที่ต้องจ่าย</a><a class="active" href="installments.html">💳 รายการผ่อน</a><a href="invoice.html">🧾 ออกบิล</a></nav></header><main class="container"><section class="panel" style="padding:14px 18px"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><div><strong>💡 วิธีใช้</strong><div class="note">เพิ่มรายการ → ระบบสร้างงวด → กด “จ่ายแล้ว” เมื่อชำระจริง → เลือกบัญชีหรือเงินสด</div></div><button class="undo-btn" onclick="mmBackup()">สำรองข้อมูล</button></div></section><section class="panel"><div class="panel-title"><h2>+ เพิ่มรายการผ่อน</h2><p>กรอกข้อมูลครั้งเดียว ระบบสร้างตารางงวดให้อัตโนมัติ</p></div><form id="f" class="form-grid"><label>ชื่อรายการ<input id="name" placeholder="เช่น โทรศัพท์มือถือ" required></label><label>ราคาทั้งหมด<input id="price" type="number" min="0" step=".01" required></label><label>จำนวนงวด<input id="terms" type="number" min="1" required></label><label>จำนวนเงินต่องวด<input id="payment" type="number" min="0" step=".01" required></label><label>วันที่ครบกำหนด<input id="day" type="number" min="1" max="31" placeholder="15" required></label><label>เริ่มผ่อนเดือน<input id="start" type="month" required></label><button class="primary-btn">+ สร้างรายการผ่อน</button></form></section><div id="list" class="installment-list"></div><div id="empty" class="empty panel">ยังไม่มีรายการผ่อน</div></main><script src="storage.js"></script><script src="storage.js"></script><script src="installments.js"></script><script>if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").catch(()=>{});}</script></body></html>
